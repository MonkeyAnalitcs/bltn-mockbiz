  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => { r += `<rect x="${a}" y="${b}" width="7" height="7"/><rect x="${a + 1}" y="${b + 1}" width="5" height="5" fill="#fff"/><rect x="${a + 2}" y="${b + 2}" width="3" height="3"/>`; });
  return `<svg viewBox="-1 -1 31 31" class="w-56 h-56 bg-white rounded" shape-rendering="crispEdges">${r}</svg>`; }

let palSel = 0, palOps = [];
function palComandos(){
  const ops = [], P = S.area === 'parceiro';
  (P ? NAV_P.filter(i => i[0] !== 'docs') : S.projTools.filter(t => PAGES[t]).map(t => [t, TOOLS[t].nome, TOOLS[t].icon])).forEach(i => ops.push({g:'Ir para', t:i[1], i:i[2], f:() => switchPage(i[0])}));
  if (P) S.clientes.forEach(c => ops.push({g:'Clientes', t:c.nome, i:'folder', f:() => entrarProjeto(c.id)})); else S.contatos.forEach(c => ops.push({g:'Contatos', t:nomeDe(c), i:'user', d:fone(c.fone), f:() => openPainel(c.id)}));
  return ops;
}
function openPalette(){ $('palette').innerHTML = `<div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg w-full max-w-xl overflow-hidden border border-gray-200 dark:border-gray-700"><input class="w-full px-4 py-3 bg-transparent outline-none border-b border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-100" id="pal-in" placeholder="Buscar tela, cliente ou contato..." oninput="palSel=0;drawPal()" onkeydown="teclaPal(event)"><div class="max-h-80 overflow-auto p-1.5" id="pal-lista"></div></div>`; $('palette').classList.remove('hidden'); $('palette').classList.add('flex'); palSel = 0; drawPal(); $('pal-in').focus(); }
function closePalette(){ $('palette').classList.add('hidden'); $('palette').classList.remove('flex'); $('palette').innerHTML = ''; }
function foraPaleta(e){ if (e.target.id === 'palette') closePalette(); }
function drawPal(){ const q = norm($('pal-in').value); palOps = palComandos().filter(o => (!q && o.g === 'Ir para') || (q && (norm(o.t).includes(q) || norm(o.d).includes(q)))); let g = '';
  $('pal-lista').innerHTML = palOps.map((o, i) => (o.g !== g ? `<div class="px-3 pt-2 pb-1 text-[11px] font-semibold uppercase text-gray-400">${g = o.g}</div>` : '') + `<button onclick="rodarPal(${i})" class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-left ${i === palSel ? 'bg-gray-100 dark:bg-gray-700' : ''} text-gray-800 dark:text-gray-100">${ic(o.i, 'w-4 h-4')}${esc(o.t)}${o.d ? `<span class="ml-auto text-xs text-gray-400">${esc(o.d)}</span>` : ''}</button>`).join('') || '<div class="px-3 py-2 text-xs">Nada encontrado</div>'; icons(); }
function teclaPal(e){ if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palOps.length - 1, palSel + 1); drawPal(); } else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); drawPal(); } else if (e.key === 'Enter') { e.preventDefault(); rodarPal(palSel); } }
function rodarPal(i){ const o = palOps[i]; if (!o) return; closePalette(); o.f(); }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if ($('palette').classList.contains('flex')) closePalette(); else openPalette(); return; }
  if (e.key === 'Escape') { fecharMenu(); if ($('palette').classList.contains('flex')) closePalette(); else if ($('modal').classList.contains('flex')) closeModal(); else if (S.painel) fecharPainel(); }
});

  {t:'Conectar o Instagram', d:'Para publicar e ver os números no Marketing.', ok:!!S.passoInsta, ir:() => { S.passoInsta = true; switchPage('redesperfis'); }}]; }
function abrirPassos(){ const pz = passosCliente(), feitos = pz.filter(p => p.ok).length;
  openModal('Primeiros passos', `<div class="flex items-center gap-3 mb-4"><div class="grow h-2 rounded-full bg-gray-200 dark:bg-gray-700 overflow-hidden"><div class="h-full bg-personalized-primary" style="width:${feitos / pz.length * 100}%"></div></div><span class="text-xs font-semibold">${feitos} de ${pz.length}</span></div>${pz.map((p, i) => `<div class="flex items-center gap-3 py-3 ${i ? 'border-t border-gray-200 dark:border-gray-700' : ''}"><span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold shrink-0 ${p.ok ? 'bg-green-500 text-white' : 'border border-gray-300 dark:border-gray-600'}">${p.ok ? ic('check', 'w-3.5 h-3.5') : i + 1}</span><div class="grow"><div class="font-medium ${p.ok ? 'text-gray-400 line-through' : 'text-gray-800 dark:text-gray-100'}">${p.t}</div><div class="text-xs">${p.d}</div></div>${p.ok ? '' : `<button class="btn btn-primary btn-sm" onclick="irPasso(${i})">Fazer agora</button>`}</div>`).join('')}`, '');
}
function irPasso(i){ closeModal(); passosCliente()[i].ir(); }

// Parceiro: o aviso vira lista de ativação no Dashboard e uma linha discreta nas outras telas
const _aviso = aviso;
aviso = function(){
  if (!S.ux || S.area !== 'parceiro') return _aviso();
  const at = [{t:'Conectar o domínio', ok:true}, {t:'Enviar logo e cores', ok:true}, {t:'Completar o cadastro de recebimento', ok:S.receb.etapa >= 3, ir:"switchPage('pagamentos')", bt:'Completar'}, {t:'Criar o primeiro modelo', ok:S.modelos.length > 0}, {t:'Enviar o primeiro convite', ok:S.convidou, ir:"convidar(event,'m1');renderAll()", bt:'Copiar convite'}], feitos = at.filter(a => a.ok).length;
  if (feitos === at.length) return '';
  if (S.page !== 'inicio') return `<div class="mb-6 flex items-center gap-2 text-[13px] rounded-lg bg-amber-50 dark:bg-amber-900/30 text-amber-900 dark:text-amber-100 px-3 py-2">${ic('circle-alert', 'w-4 h-4')}Faltam ${at.length - feitos} passos para os seus clientes pagarem.<button class="font-semibold underline" onclick="switchPage('inicio')">Ver passos</button></div>`;
  return `<div class="caixa p-5 mb-8"><div class="flex items-center gap-3 mb-3"><span class="w-9 h-9 rounded-lg bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 flex items-center justify-center">${ic('rocket', 'w-4 h-4')}</span><div class="grow"><div class="font-semibold text-gray-800 dark:text-gray-100">Ative a sua plataforma</div><div class="text-xs">Sem estes passos, seus clientes não conseguem pagar pelos projetos.</div></div><span class="text-sm font-semibold">${feitos} de ${at.length}</span></div><div class="h-1.5 rounded-full bg-gray-200 dark:bg-gray-700 mb-3 overflow-hidden"><div class="h-full bg-green-500" style="width:${feitos / at.length * 100}%"></div></div><div class="grid grid-cols-5 gap-3">${at.map((a, i) => `<div class="rounded-lg bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 p-3 flex flex-col"><span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold mb-2 ${a.ok ? 'bg-green-500 text-white' : 'border border-gray-300 dark:border-gray-600'}">${a.ok ? ic('check', 'w-3.5 h-3.5') : i + 1}</span><div class="text-[13px] font-medium ${a.ok ? 'text-gray-400' : 'text-gray-800 dark:text-gray-100'} grow">${a.t}</div>${a.ok ? '' : `<button class="btn btn-primary btn-sm mt-2" onclick="${a.ir}">${a.bt}</button>`}</div>`).join('')}</div></div>`;
};

// WhatsApp: prazo da janela na lista e painel do contato ao lado da conversa
const _drawWaLista = drawWaLista;
drawWaLista = function(){
  _drawWaLista(); if (!S.ux) return;
  waFiltradas().forEach(v => { const b = document.querySelector(`#wa-lista button[onclick="abrirConversa('${v.id}')"] .text-\\[11px\\]`); if (!b) return; const h = JANELA[v.id];
    b.insertAdjacentHTML('afterend', h === undefined ? `<span class="ml-1 text-[10px] rounded px-1 bg-gray-200 dark:bg-gray-700 text-gray-500" title="A janela de 24 horas fechou">fechada</span>` : h <= 6 ? `<span class="ml-1 text-[10px] rounded px-1 bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-200" title="Tempo até a janela de 24 horas fechar">${h} h</span>` : ''); });
};
const _drawWaConv = drawWaConv;
drawWaConv = function(){
  _drawWaConv(); if (!S.ux) return;
  const v = S.conversas.find(x => x.id === S.waSel && x.numero === S.waNumero); if (!v) return;
  const el = $('wa-conv'), c = ct(v.contato), k = cardDe(c.id), h = JANELA[v.id];
  // topo: "quem responde" no lugar da chave
  const chaveAg = el.querySelector('[title="Agente de IA nesta conversa"]'); if (chaveAg) chaveAg.parentElement.outerHTML = `<span class="inline-flex items-center gap-2 text-[13px]"><span class="text-gray-500">Quem responde</span><span class="inline-flex rounded-lg border border-gray-200 dark:border-gray-700 p-0.5">${[['ia', 'Agente', 'sparkles'], ['eu', 'Você', 'user']].map(o => `<button onclick="quemResponde('${v.id}','${o[0]}')" class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-xs ${(v.dono === 'ia') === (o[0] === 'ia') ? (o[0] === 'ia' ? 'bg-violet-500 text-white' : 'bg-gray-800 text-white dark:bg-gray-100 dark:text-gray-900') : 'text-gray-500'}">${ic(o[2], 'w-3.5 h-3.5')}${o[1]}</button>`).join('')}</span></span>`;
  const etapa = el.querySelector(`[onclick="menuEtapa(event,'${c.id}')"]`); if (etapa) etapa.remove();
  if (h !== undefined && h <= 6) el.firstElementChild.insertAdjacentHTML('afterend', `<div class="px-4 py-2 text-xs bg-amber-50 text-amber-900 border-b border-amber-200 dark:bg-[#2b2a1e] dark:text-amber-100 dark:border-transparent flex items-center gap-2">${ic('timer', 'w-4 h-4')}<span><b>A janela de 24 horas fecha em ${h} horas.</b> Depois disso, só mensagens de modelo até o contato responder.</span></div>`);
  // painel do contato ao lado
  const corpo = document.createElement('div'); corpo.className = 'flex grow min-h-0';
  const msgs = $('wa-m'), comp = msgs.nextElementSibling, col = document.createElement('div'); col.className = 'flex flex-col grow min-w-0';
  msgs.parentElement.insertBefore(corpo, msgs); col.appendChild(msgs); col.appendChild(comp); corpo.appendChild(col);
  const tarefas = S.tarefas.filter(t => t.contato === c.id);
  corpo.insertAdjacentHTML('beforeend', `<aside class="w-72 shrink-0 border-l border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-y-auto p-4 space-y-4 text-[13px]">
    <div class="text-center"><div class="flex justify-center">${av(c.nome, 'w-14 h-14 text-base')}</div><div class="font-semibold text-gray-800 dark:text-gray-100 mt-2">${esc(nomeDe(c))}</div><div class="text-xs">${fone(c.fone)}</div>${c.email ? `<div class="text-xs">${esc(c.email)}</div>` : ''}</div>
    <div><label class="text-xs font-medium text-gray-800 dark:text-gray-100" for="wc-etapa">Etapa no Funil de Vendas</label><select class="form-input mt-1 py-1.5" id="wc-etapa" onchange="moverEtapa('${c.id}',this.value)"><option value="">Fora do funil</option>${S.etapas.map((e, i) => `<option value="${i}" ${k && k.etapa === i ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></div>
    ${k ? `<div class="grid grid-cols-2 gap-2"><div><label class="text-xs font-medium text-gray-800 dark:text-gray-100" for="wc-resp">Responsável</label><select class="form-input mt-1 py-1.5 px-2" id="wc-resp" onchange="cardDe('${c.id}').resp=this.value;flashSalvoWa()"><option value="">-</option>${S.usuarios.filter(u => u.nome !== '-').map(u => `<option ${k.resp === u.nome ? 'selected' : ''}>${u.nome}</option>`).join('')}</select></div><div><label class="text-xs font-medium text-gray-800 dark:text-gray-100" for="wc-valor">Valor (R$)</label><input class="form-input mt-1 py-1.5 px-2" id="wc-valor" value="${k.valor || ''}" onchange="valorWa('${c.id}',this.value)"></div></div>` : ''}
    <div><div class="flex items-center mb-1"><span class="text-xs font-medium text-gray-800 dark:text-gray-100 grow">Tarefas</span><button class="text-xs text-blue-500" onclick="tarefaDaConversa('${c.id}')">+ Tarefa</button></div>${tarefas.length ? tarefas.map(t => `<button class="flex items-start gap-2 w-full text-left py-1.5" onclick="abrirRegistro('tarefa','${t.id}')">${ic(t.status === 'Pendente' ? 'circle' : 'circle-check', 'w-4 h-4 mt-0.5 ' + (t.status === 'Pendente' ? 'text-gray-400' : 'text-green-500'))}<span><span class="block text-gray-800 dark:text-gray-100">${esc(t.titulo)}</span><span class="block text-xs">${t.quando}</span></span></button>`).join('') : '<div class="text-xs text-gray-400">Nenhuma tarefa.</div>'}</div>
    <div class="flex items-center gap-2 text-xs text-green-600 dark:text-green-400 opacity-0 transition" id="wc-salvo">${ic('check', 'w-3.5 h-3.5')}Salvo</div>
    <button class="btn btn-sec btn-sm w-full" onclick="openPainel('${c.id}')">Abrir ficha completa</button></aside>`);
  icons(); msgs.scrollTop = msgs.scrollHeight;
};
function quemResponde(id, quem){ const v = S.conversas.find(x => x.id === id); if (v.dono === quem || (quem === 'eu' && v.dono !== 'ia')) return; togAgenteConversa(id); }
function valorWa(cid, v){ cardDe(cid).valor = Number(String(v).replace(/\./g, '').replace(',', '.')) || 0; flashSalvoWa(); }
function flashSalvoWa(){ const e = $('wc-salvo'); if (!e) return; e.classList.remove('opacity-0'); setTimeout(() => e.classList.add('opacity-0'), 1500); }
function tarefaDaConversa(cid){ const t = {id:nid('t'), contato:cid, titulo:'Retornar contato', desc:'', resp:'Carla Mendes', quando:'18 de novembro, 10:00', status:'Pendente'}; S.tarefas.unshift(t); drawWaConv(); abrirRegistro('tarefa', t.id); }

// Salvar sozinho: agente e fichas
const _sujo = sujo;
sujo = function(){ if (!S.ux) return _sujo(); flashSalvo(); };
const _drawRegistro = drawRegistro;
drawRegistro = function(){
  _drawRegistro(); if (!S.ux) return;
  const m = $('modal'), bt = m.querySelector('[onclick="atualizarRegistro()"]');
  if (bt) bt.outerHTML = `<span class="text-xs text-gray-400 flex items-center gap-1">${ic('cloud', 'w-3.5 h-3.5')}As mudanças são salvas sozinhas</span>`;
  const sv = m.querySelector('.text-gray-400.mr-1'); if (sv) sv.insertAdjacentHTML('afterend', `<span id="rg-salvo" class="text-xs text-green-600 dark:text-green-400 mr-2 opacity-0 transition">Salvo</span>`);
  let tm = null; m.querySelectorAll('input,select,textarea').forEach(x => { if (x.id === 'rg-com') return; x.addEventListener(x.tagName === 'SELECT' ? 'change' : 'input', () => { clearTimeout(tm); tm = setTimeout(() => atualizarRegistro(true), 500); }); });
  icons();
};
function marcarSalvoReg(){ const e = $('rg-salvo'); if (!e) return; e.classList.remove('opacity-0'); setTimeout(() => e.classList.add('opacity-0'), 1500); }

// Agente: teste fixo ao lado, sem botão de salvar
const _pAgente = PAGES.agente;
PAGES.agente = function(){
  _pAgente(); if (!S.ux) return;
  const pg = $('page'), cont = pg.querySelector('.space-y-6'), bt = pg.querySelector('[onclick="abrirTeste()"]'); if (bt) bt.remove();
  const grid = document.createElement('div'); grid.className = 'grid grid-cols-[minmax(0,1fr)_360px] gap-6 items-start';
  cont.parentElement.insertBefore(grid, cont); grid.appendChild(cont);
  grid.insertAdjacentHTML('beforeend', `<div class="sticky top-0 caixa overflow-hidden flex flex-col h-[calc(100vh-150px)]"><div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200 dark:border-gray-700"><span class="font-semibold text-gray-800 dark:text-gray-100 grow">Testar o agente</span><button class="text-xs text-blue-500" onclick="S.agente.teste=S.agente.teste.slice(0,1);drawTeste()">Recomeçar</button></div><div class="wa-fundo grow overflow-y-auto p-3 flex flex-col gap-2" id="ag-msgs"></div><div class="flex gap-2 p-3 border-t border-gray-200 dark:border-gray-700"><input class="form-input" id="ag-perg" placeholder="Pergunte como um cliente" onkeydown="teclaTeste(event)"><button class="btn btn-primary" onclick="perguntar()">${ic('send-horizontal', 'w-4 h-4')}</button></div><p class="text-[11px] px-3 pb-3">Responde com o que está nesta tela, inclusive o que você acabou de mudar.</p></div>`);
  const hs = $('ag-horas'); if (hs) hs.className = 'grid grid-cols-4 gap-2';
  drawTeste(); icons();
};

// Criar só depois de confirmar
const _pAutomacao = PAGES.automacao;
PAGES.automacao = function(){
  if (!S.ux) return _pAutomacao();
  $('page').innerHTML = S.automacoes.length ? titulo('Automação', `<button class="btn btn-sec" onclick="novaAutomacao()">${ic('plus', 'w-4 h-4')}Automação</button>`) + `<div class="tabela"><table><thead><tr><th>Nome</th><th>Quando</th><th>O que faz</th><th>Status</th></tr></thead><tbody>${S.automacoes.map(a => `<tr><td class="text-gray-800 dark:text-gray-100">${esc(a.nome)}</td><td>${esc(a.gatilho)}</td><td>${esc(a.acao)}</td><td>${pCinza('Rascunho')}</td></tr>`).join('')}</tbody></table></div>`
    : vazio('package', 'Você ainda não tem automações', 'Para começar a usar esta ferramenta, crie uma nova automação.', `<button class="btn btn-sec" onclick="novaAutomacao()">${ic('plus', 'w-4 h-4')}Automação</button>`);
};
function novaAutomacao(){
  openModal('Nova automação', `<div class="mb-4"><label class="lbl" for="au-nome"><span class="text-red-500">*</span> Nome</label><input class="form-input" id="au-nome" placeholder="Ex.: Boas-vindas a lead novo"></div><div class="grid grid-cols-2 gap-4"><div><label class="lbl" for="au-gat">Quando</label><select class="form-input" id="au-gat"><option>Card entrar em uma etapa do funil</option><option>Contato ser criado</option><option>Tarefa vencer</option></select></div><div><label class="lbl" for="au-acao">O que fazer</label><select class="form-input" id="au-acao"><option>Enviar mensagem no WhatsApp</option><option>Criar tarefa</option><option>Mudar o responsável</option></select></div></div><p class="text-xs mt-3">A automação nasce como rascunho e só começa a rodar quando você ativar.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="criarAutomacao()">Criar rascunho</button>`); }
function criarAutomacao(){ const n = $('au-nome').value.trim(); if (!n) { $('au-nome').focus(); showToast('Dê um nome à automação'); return; } S.automacoes.push({nome:n, gatilho:$('au-gat').value, acao:$('au-acao').value}); closeModal(); renderAll(); showToast('Rascunho criado'); }
function escolherConexao(){
  const op = (i, t, d, fn) => `<button class="text-left rounded-lg border border-gray-200 dark:border-gray-700 p-4 hover:border-gray-400" onclick="${fn}"><span class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center mb-2">${ic(i, 'w-4 h-4')}</span><span class="block font-semibold text-gray-800 dark:text-gray-100">${t}</span><span class="block text-xs mt-1">${d}</span></button>`;
  openModal('Novo número', `<p class="mb-4">Como você quer conectar o número? A conexão só é criada depois desta escolha.</p><div class="grid grid-cols-2 gap-3">${op('qr-code', 'Pelo celular (QR Code)', 'Use o WhatsApp do aparelho. Leva um minuto.', "closeModal();switchPage('wanovo')")}${op('badge-check', 'API oficial do WhatsApp Business', 'Para volume maior e mensagens de modelo.', 'closeModal();embreve()')}</div>`, `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>`); }

// Notificações: marcar todas como lidas
const _abrirNotificacoes = abrirNotificacoes;
abrirNotificacoes = function(e){
  _abrirNotificacoes(e); if (!S.ux || !S.notifs.length) return;
  $('ctx').firstElementChild.insertAdjacentHTML('afterbegin', `<div class="flex items-center px-3 py-2 border-b border-gray-200 dark:border-gray-600"><b class="grow text-[13px] text-gray-800 dark:text-gray-100">Notificações</b><button class="text-xs text-blue-500" onclick="event.stopPropagation();S.notifs=[];fecharMenu();drawSide();icons();showToast('Notificações marcadas como lidas')">Marcar todas como lidas</button></div>`);
};

renderAll();
</script>
</body>
</html>
